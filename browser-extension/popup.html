<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GenAIScope Capture</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; }
      label { display: block; margin-bottom: 8px; font-size: 13px; }
      input[type="text"], select, textarea {
        width: 100%; box-sizing: border-box; padding: 4px; margin-top: 4px; font-family: inherit;
      }
      textarea { resize: vertical; }
      .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      button { width: 100%; padding: 6px; cursor: pointer; }
      #status { font-size: 12px; color: #666; min-height: 14px; }
      hr { border: none; border-top: 1px solid #ddd; margin: 14px 0; }
      h2 { font-size: 13px; margin: 0 0 8px; }
      #askStatus { font-size: 12px; color: #666; min-height: 14px; }
      #askResult { display: none; margin-top: 8px; font-size: 12px; }
      #askResult.visible { display: block; }
      #askResultText { white-space: pre-wrap; background: #f5f5f5; padding: 8px; border-radius: 4px; max-height: 160px; overflow-y: auto; }
      .meta { display: flex; gap: 8px; margin-top: 6px; color: #666; flex-wrap: wrap; }
      .badge { background: #eef; border-radius: 3px; padding: 2px 6px; }
      #askResult.error #askResultText { background: #fdecea; color: #611a15; }
    </style>
  </head>
  <body>
    <div class="row">
      <span>Capture enabled</span>
      <input type="checkbox" id="enabled" />
    </div>
    <label>
      API base URL
      <input type="text" id="apiBase" placeholder="http://127.0.0.1:8000" />
    </label>
    <button id="save">Save</button>
    <p id="status"></p>

    <hr />

    <h2>Ask GenAIScope (live gateway)</h2>
    <label>
      Provider
      <select id="provider">
        <option value="auto">Auto (router picks)</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="google">Google</option>
      </select>
    </label>
    <label>
      Prompt
      <textarea id="prompt" rows="3" placeholder="Ask anything..."></textarea>
    </label>
    <button id="ask">Ask</button>
    <p id="askStatus"></p>
    <div id="askResult">
      <div id="askResultText"></div>
      <div class="meta" id="askResultMeta"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
