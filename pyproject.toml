[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genaiscope"
version = "0.1.0"
description = "Open-source Python toolkit to inspect, test, secure, optimize, and operationalize GenAI applications before production."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "Sapan Mohanty" }
]

maintainers = [
    { name = "GenAIScope Contributors" }
]

keywords = [
    "genai",
    "generative-ai",
    "llm",
    "llmops",
    "ai-agents",
    "rag",
    "rag-evaluation",
    "prompt-engineering",
    "prompt-testing",
    "llm-evaluation",
    "ai-safety",
    "ai-security",
    "prompt-injection",
    "pii-detection",
    "structured-output",
    "ai-observability",
    "cost-optimization",
    "python-library",
    "developer-tools",
    "open-source"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
    "Typing :: Typed"
]

dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
    "httpx>=0.25.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0"
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0,<2.0.0"
]

anthropic = [
    "anthropic>=0.25.0,<1.0.0"
]

google = [
    "google-generativeai>=0.5.0,<1.0.0"
]

dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "build>=1.2.0,<2.0.0",
    "twine>=5.0.0,<6.0.0"
]

docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings[python]>=0.24.0,<1.0.0"
]

[project.urls]
Homepage = "https://github.com/TravelXML/genaiscope"
Documentation = "https://travelxml.github.io/genaiscope"
Repository = "https://github.com/TravelXML/genaiscope"
Issues = "https://github.com/TravelXML/genaiscope/issues"
Changelog = "https://github.com/TravelXML/genaiscope/releases"

[project.scripts]
genaiscope = "genaiscope.cli.main:app"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["genaiscope*"]

[tool.setuptools.package-data]
genaiscope = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF"
]
ignore = [
    "E501"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/genaiscope --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/genaiscope"]
omit = [
    "*/tests/*",
    "*/test_*.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]
